      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef4fb"/><stop offset="1" stop-color="#bfe0f3"/>
    </linearGradient>
    <radialGradient id="ouro-fundo" cx=".12" cy=".88" r=".5">
